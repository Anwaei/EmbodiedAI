[project]
name = "embodiedai-vla-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[peft,smolvla,training]==0.6.0",
    "numpy>=2.2,<2.3",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec>=0.7,<0.8",
    "torchvision==0.23.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
