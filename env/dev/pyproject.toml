[project]
name = "embodiedai-dev-env"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mypy>=1.19,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pytest-timeout>=2.4,<3",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
pythonpath = ["../../src"]
testpaths = ["../../tests"]
